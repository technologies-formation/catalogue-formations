name: Update catalogue

on:
  # Daily update at 05:07 Europe/Zurich
  schedule:
    - cron: '7 5 * * *'
      timezone: 'Europe/Zurich'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Exécuter sans promotion, commit, push ni déploiement'
        required: true
        default: true
        type: boolean
      allow_large_catalogue_drop:
        description: 'Autoriser exceptionnellement une baisse du catalogue supérieure ou égale à 5 %'
        required: true
        default: false
        type: boolean

concurrency:
  group: catalogue-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.validate.outputs.has_changes }}
      snapshot_date: ${{ steps.validate.outputs.snapshot_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Import candidate catalogue
        run: npm run import:catalogue
      - name: Validate candidate and determine changes
        id: validate
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          ALLOW_LARGE_CATALOGUE_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_catalogue_drop || false }}
        run: node scripts/catalogueWorkflow.mjs
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Upload candidate report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalogue-candidate-report
          path: reports/catalogue-import-report.candidate.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload candidate snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalogue-candidate-snapshot
          path: reports/officialCatalogueSnapshot.candidate.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: ${{ needs.validate.outputs.has_changes == 'true' && (github.event_name == 'schedule' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download candidate report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalogue-candidate-report
          path: reports
      - name: Download candidate snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalogue-candidate-snapshot
          path: reports
      - name: Promote validated catalogue
        run: npm run promote:catalogue -- --confirm-date "${{ needs.validate.outputs.snapshot_date }}"
      - name: Run tests after promotion
        run: npm test
      - name: Run lint after promotion
        run: npm run lint
      - name: Build application after promotion
        run: npm run build
      - name: Check promoted diff
        run: git diff --check
      - name: Commit promoted data only
        env:
          SNAPSHOT_DATE: ${{ needs.validate.outputs.snapshot_date }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { assertAllowedCommitFiles } from './scripts/catalogueWorkflow.mjs'
          const files = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean)
          assertAllowedCommitFiles(files)
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/officialCatalogueSnapshot.json reports/catalogue-import-report.md
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { assertAllowedCommitFiles } from './scripts/catalogueWorkflow.mjs'
          const files = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean)
          assertAllowedCommitFiles(files)
          NODE
          git commit -m "data: mettre à jour automatiquement le catalogue au ${SNAPSHOT_DATE}"
      - name: Push promoted data
        run: git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
      - name: Verify public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 5 --max-time 5 --output /dev/null "$PAGE_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 6
            fi
          done
          exit 1

  notify:
    needs: [validate, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download candidate report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalogue-candidate-report
          path: reports
      - name: Determine notification status
        id: notification
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          HAS_CHANGES: ${{ needs.validate.outputs.has_changes }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PUBLICATION_RESULT: ${{ needs.publish.result }}
        run: node scripts/catalogueWorkflow.mjs --notification-status
      - name: Send catalogue result email
        if: ${{ always() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CATALOGUE_STATUS: ${{ steps.notification.outputs.status || 'ALERT' }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run mail:catalogue
