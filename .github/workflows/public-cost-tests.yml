name: Public pilot bounds
on:
  push:
    branches: ['feat/public-cost-bounds-2026-10-28']
  pull_request:
    paths: ['server/**', '.github/workflows/public-cost-tests.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
