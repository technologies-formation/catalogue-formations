name: Catalogue layout checks
on:
  push:
    branches: ['feat/catalogue-compact-layout']
  pull_request:
    paths: ['src/**', 'scripts/catalogueLayout.browser.mjs', '.github/workflows/catalogue-layout.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:self-hosted
      - name: Install isolated browser tooling
        run: npm install --prefix "$RUNNER_TEMP/catalogue-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/catalogue-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify compact layout with fictitious courses only
        env:
          CATALOGUE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/catalogue-browser/node_modules/playwright/index.mjs
        run: node scripts/catalogueLayout.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-layout
          path: visual-check/
          retention-days: 7
